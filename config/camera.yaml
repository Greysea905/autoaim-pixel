%YAML:1.0
---
# 已标定的相机配置
#   - 内参/畸变:calib/calibrate.py 标定,重投影误差 0.2069 px(20/20 张有效)
#   - 外参平移:来自 云台外参.md(相机光心→云台P轴 = 67.11,0,51.50 mm,取反得云台→相机)
#   - 外参旋转:暂时默认相机朝前装
calibrated: 1

# 标定图像分辨率(pixel)
image_width: 1440
image_height: 1080

# 相机内参矩阵 K
camera_matrix: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [ 1800.1535, 0., 726.6156,
          0., 1800.3144, 539.3165,
          0., 0., 1. ]

# 畸变系数 [k1, k2, p1, p2, k3]
distortion_coefficients: !!opencv-matrix
  rows: 1
  cols: 5
  dt: d
  data: [ -0.07909123, 0.13003124, 0.00289472, -0.00145888, 0.09046518 ]

# 相机→云台 旋转矩阵 R_gimbal_camera
# 正向朝前安装(光轴朝前、画面正立)：把 OpenCV 相机坐标(右/下/前)转成云台坐标(前/左/上)。
# 注意：这是「正向朝前」的假设值，符号/小角度仍需上机实测核对。
rotation_camera_to_gimbal: !!opencv-matrix
  rows: 3
  cols: 3
  dt: d
  data: [ 0., 0., 1.,
          -1., 0., 0.,
          0., -1., 0. ]

# 相机原点在云台坐标系中的位置 t_gimbal_camera(单位 m)
translation_camera_to_gimbal: !!opencv-matrix
  rows: 3
  cols: 1
  dt: d
  data: [ -0.06711, 0., -0.0515 ]

# 标定重投影误差(px)
mean_reprojection_error_px: 0.2069
